<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>artikel banner</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="banner.css">
<script src="trace.js"></script>
<style>
  /* app.png: the real app in dark mode at 2x, written by tools/screens/render.py.
     The crop shows the card and the three answer buttons after a wrong pick.
     The app's own ground matches the banner, so the crop needs no frame. */
  :root { --k: 0.95; --x0: 302; --y0: 88; }
  .artifact { left: 530px; top: 132px; width: calc(676px * var(--k)); height: calc(276px * var(--k));
              border: 0; border-radius: 0; background: var(--ground); }
  .artifact img { width: calc(1280px * var(--k)); margin-left: calc(var(--x0) * -1px * var(--k));
                  margin-top: calc(var(--y0) * -1px * var(--k)); }
</style>
</head>
<body>
<main class="sheet">
  <section class="intro">
    <img class="icon" src="icon.png" alt="">
    <h1>artikel</h1>
    <p class="sub">Practise der, die and das on 909 German nouns from A1 to B1.</p>
    <p class="meta"><span class="pad" data-state="live"></span>JavaScript · works offline · English or Persian</p>
  </section>

  <figure class="artifact" style="margin:0"><img src="app.png" alt=""></figure>

  <p class="callout lit" id="c-right" style="left:560px;top:470px;width:220px"><b>The right article</b>Marked in green after every answer, with the plural and the meaning below</p>
  <p class="callout" id="c-wrong" style="left:847px;top:470px;width:250px"><b>A wrong pick</b>Struck through, and the noun goes back to box 1 so it returns soon</p>
</main>
<script>
  // app coordinates (1x CSS px of the screenshot page) to banner coordinates
  const k = 0.95, app = (x, y) => [530 + (x - 302) * k, 132 + (y - 88) * k];
  const above = id => { const r = document.getElementById(id).getBoundingClientRect(); return [r.left + 4, r.top - 10]; };
  traces([
    [above("c-right"), app(413, 360), { lit: true, r: 0, tail: 24 }],
    [above("c-wrong"), app(640, 360), { r: 0, tail: 24 }],
  ]);
</script>
</body>
</html>
