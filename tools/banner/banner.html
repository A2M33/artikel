<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>artikel banner</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="banner.css">
</head>
<body>
<main class="sheet">
  <div class="top">
    <header class="head">
      <img class="icon" src="icon.png" width="104" height="104" alt="">
      <div>
        <h1>artikel</h1>
        <p class="sub">A der, die or das trainer for German nouns. A card box brings back the words you miss until the genders stick.</p>
      </div>
    </header>

    <section class="card" aria-label="Card">
      <p class="phrase" lang="de"><span class="slot">die</span> Hauptstadt</p>
      <div class="choices" lang="de">
        <span class="choice is-wrong">der</span>
        <span class="choice is-correct">die</span>
        <span class="choice">das</span>
      </div>
    </section>
  </div>

  <section class="readings">
    <div class="cell">
      <p class="reading">909</p>
      <p class="tag">Nouns from A1 to B1</p>
    </div>
    <div class="cell">
      <p class="reading">5</p>
      <p class="tag">Boxes of spaced repetition</p>
    </div>
    <div class="cell">
      <p class="reading">EN <span class="fa" lang="fa">فا</span></p>
      <p class="tag">Full English or Persian interface</p>
    </div>
    <div class="cell">
      <p class="reading">0</p>
      <p class="tag">Requests after the page loads</p>
    </div>
  </section>
</main>
</body>
</html>
