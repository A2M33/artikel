name: test

on:
  push:
  pull_request:

jobs:
  words:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/words.test.mjs
      - run: node --check app.js && node --check words.js
